<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>
  <!-- Rounded Hexagon / Shield Container -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#grad)" />
  <!-- Factory / Manufacturing Geometric Icon -->
  <g fill="url(#innerGrad)">
    <!-- Factory Roof with sawteeth (industrial shed) -->
    <path d="M16 46 V32 L26 38 V32 L36 38 V22 L48 28 V46 Z" />
    <!-- Chimney smoke / production dots -->
    <circle cx="43" cy="18" r="2.5" opacity="0.9" />
    <circle cx="46" cy="12" r="1.8" opacity="0.7" />
    <!-- Plant windows -->
    <rect x="20" y="40" width="4" height="6" rx="1" fill="#4f46e5" opacity="0.8" />
    <rect x="28" y="40" width="4" height="6" rx="1" fill="#4f46e5" opacity="0.8" />
    <rect x="36" y="40" width="4" height="6" rx="1" fill="#4f46e5" opacity="0.8" />
  </g>
  <!-- Gear cog emblem in corner -->
  <circle cx="22" cy="24" r="5" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3,1.5" />
  <circle cx="22" cy="24" r="2.5" fill="#ffffff" />
</svg>